
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Home</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0f14;color:white;font-family:Arial}
header{height:65px;background:#171a22;display:flex;
align-items:center;padding:15px;gap:20px}
.logo{font-size:27px;font-weight:900}
.logo span{color:#4385ff}
.icons{margin-left:auto;font-size:25px}
main{padding:20px;max-width:750px;margin:auto}
h2{font-size:25px}
.user{display:flex;align-items:center;gap:12px;margin:25px 0}
.user img{width:65px;height:65px;border-radius:50%}
.username{font-size:24px;font-weight:bold}
.box{background:#191d26;border:1px solid #343b49;
padding:18px;border-radius:15px;margin:20px 0}
input{width:100%;padding:14px;border-radius:10px;
border:1px solid #444;background:#090c12;color:white;
font-size:16px}
button{cursor:pointer}
.search{background:#3478f6;color:white;border:0;
padding:13px;border-radius:10px;margin-top:10px;width:100%}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:#242a36;border-radius:12px;padding:15px}
.game img{width:100%;border-radius:9px}
.recipient{display:none;align-items:center;gap:13px;margin-top:20px}
.recipient img{width:75px;height:75px;border-radius:12px}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.amount{padding:13px 2px;background:#272e3b;color:white;
border:1px solid #444;border-radius:9px}
.amount.active{border:2px solid #4385ff;background:#19345e}
.send{width:100%;padding:16px;margin-top:18px;
background:#3478f6;color:white;border:0;border-radius:10px;
font-size:17px;font-weight:bold}
#result{display:none;background:#252c39;padding:15px;
border-radius:10px;margin-top:15px;line-height:1.6}
small{color:#aeb7c7}
</style>
</head>
<body>

<header>
 <div class="logo">R<span>◈</span>BLOX</div>
 <div class="icons">⌕　◈　♧</div>
</header>

<main>
 <h2>Home</h2>

 <div class="user">
  <div style="font-size:40px">🙂</div>
  <b style="font-size:22px">Roblox Home</b>
 </div>

 <div class="box">
  <h2>Recommended For You</h2>
  <div class="games">
   <div class="game">🌈<br>Speed Keyboard</div>
   <div class="game">🥚<br>Steal An Egg</div>
   <div class="game">🏡<br>Brookhaven</div>
   <div class="game">⚔️<br>Blade Ball</div>
  </div>
 </div>

 <div class="box">
  <h2>Send Robux</h2>
  <p><small>Search Roblox Username</small></p>
  <input id="username" placeholder="Enter username">

  <button class="search" onclick="searchUser()">Search</button>

  <div class="recipient" id="recipient">
   <img id="avatar">
   <div>
    <b id="displayName"></b>
    <p id="userName"></p>
   </div>
  </div>

  <hr style="border-color:#333;margin:22px 0">

  <h3>Select Amount</h3>
  <div class="amounts">
   <button class="amount" onclick="choose(25,this)">25</button>
   <button class="amount active" onclick="choose(50,this)">50</button>
   <button class="amount" onclick="choose(100,this)">100</button>
   <button class="amount" onclick="choose(200,this)">200</button>
  </div>

  <button class="send" onclick="sendRobux()">Send Robux</button>

  <div id="result"></div>
 </div>

 <p style="text-align:center;color:#888;font-size:11px">
  Unofficial Demo • No real Robux transfers
 </p>
</main>

<script>
let selected=50;
let player=null;

function choose(amount,button){
 selected=amount;
 document.querySelectorAll('.amount').forEach(b=>
 b.classList.remove('active'));
 button.classList.add('active');
}

async function searchUser(){
 const username=document.getElementById('username').value.trim();
 const result=document.getElementById('result');

 if(!username){
  alert('Enter a username');
  return;
 }

 result.style.display='block';
 result.innerText='Searching...';

 try{
  const response=await fetch(
   'https://users.roblox.com/v1/usernames/users',
   {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
     usernames:[username],
     excludeBannedUsers:true
    })
   }
  );

  if(!response.ok) throw new Error('Search failed');

  const data=await response.json();

  if(!data.data.length){
   throw new Error('User not found');
  }

  player=data.data[0];

  document.getElementById('displayName').innerText=
   player.displayName;

  document.getElementById('userName').innerText=
   '@'+player.name;

  document.getElementById('avatar').src=
   'https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='
   +player.id+'&size=150x150&format=Png&isCircular=true';

  document.getElementById('recipient').style.display='flex';
  result.innerText='Player found successfully!';

 }catch(error){
  player=null;
  document.getElementById('recipient').style.display='none';
  result.innerText='Could not find player. Check username or browser connection.';
 }
}

function sendRobux(){
 const result=document.getElementById('result');

 if(!player){
  result.style.display='block';
  result.innerText='Search for a player first!';
  return;
 }

 result.style.display='block';
 result.innerHTML=
  '<h2>✓ Demo Complete</h2>'+
  'Player: '+player.name+'<br>'+
  'Amount: '+selected+' Robux<br>'+
  '<small>No real Robux were transferred.</small>';
}
</script>
</body>
</html>
